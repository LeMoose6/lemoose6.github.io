<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dice Wars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container-fluid">
        <h1 class="text-center">Dice Wars</h1>
        <div class="progress my-4" style="height: 30px;">
            <div id="playerBar" class="progress-bar bg-success" role="progressbar" style="width: 50%"></div>
            <div id="lostBar" class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
            <div id="opponentBar" class="progress-bar bg-primary" role="progressbar" style="width: 50%" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
    </div>

    <div id="last-played" class="container">
        <div class="row text-center">
            <div class="col">
                <h2 id="playerName">Player</h2>
                <h3>Last Roll:</h4>
                <h4 id="playerLastRoll" class="text-success">0</h4>
            </div>
            <div class="col">
                <h2 id="opponentName">Opponent</h2>
                <h3>Last Roll:</h4>
                <h4 id="opponentLastRoll" class="text-primary">0</h4>
            </div>
        </div>
        <div class="row">
          <button id="roll" class="btn btn-secondary" style="background-color: seagreen;">Roll The Die</button>
        </div>
    </div>

    <div id="playing-field" class=" my-5 container text-center">
        <div class="row">
            <div class="col"><h2 id="one">1</h2></div>
            <div class="col"><h2 id="two">2</h2></div>
            <div class="col"><h2 id="three">3</h2></div>
            <div class="col"><h2 id="four">4</h2></div>
            <div class="col"><h2 id="five">5</h2></div>
            <div class="col"><h2 id="six">6</h2></div>
        </div>
    </div>

    <div id="scoring" class="my-5 container text-center">
      <div class="row">
        <div class="col"></div>
        <h4 id="playerReport" class="col text-success">50</h4>
        <h4 id="opponentReport" class="col text-primary">50</h4>
        <div class="col"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="index.js"></script>
  </body>
</html>
