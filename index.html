<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeMoose6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar sticky-top border-bottom border-6 border-success navbar-expand-lg bg-success-subtle">
        <div class="container-fluid">
            <div class="navbar-brand" data-page="home">LeMoose6</div>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <div class="nav-link" data-page="judymudd">Judy Mudd</div>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <div class="nav-link" data-page="news">News</div>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <div class="nav-link" data-page="library">Library</div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Homepage -->
    <div id="home" class="page container-fluid g-0 text-center">
        <div class="row bg-dark py-3">
            <!-- Filler Column -->
            <div class="col"></div>
            
            <!-- Featured Content Carousel-->
            <div class="col-4 g-0">
                <h2 class="text-light py-1">Featured Content</h2>
                <div class="carousel slide py-2" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="images/judy-mudd-1.png" class="d-block w-100" alt="To Kill a Judithbird">
                            <div class="carousel-caption d-none d-md-block">
                                <a role="button" class="btn btn-primary btn-lg" href="/file/judy-mudd-1.pdf" target="_blank">Read Now</a>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="images/judy-mudd-holiday-22.png" class="d-block w-100" alt="A Miracle on Judy Mudd Streey">
                            <div class="carousel-caption d-none d-md-block">
                                <a role="button" class="btn btn-primary btn-lg" href="/file/judy-mudd-holiday-22.pdf" target="_blank">Read Now</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filler Column-->
            <div class="col"></div>
            
            <!-- Latest News -->
            <div class="col-4">
                <h2 class="text-light py-1">Latest News</h2>
                <div class="card py-1">
                    <div class="card-header" id="latest-date">
                        Most-Recent: 
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" id="latest-title"></h5>
                        <p class="card-text" id="latest-content"></p>
                    </div>
                </div>
                <div class="card py-1">
                    <div class="card-header" id="featured-date">
                        Recently Featured: 
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" id="featured-title"></h5>
                        <p class="card-text" id="featured-content"></p>
                    </div>
                </div>
            </div>

            <!-- Filler Column -->
            <div class="col"></div>
        </div>
    </div>

    <div id="judymudd" class="page container-fluid g-0 text-center">
        JUDY MUDD
    </div>

    <div id="news" class="page container-fluid g-0 text-center">
        NEWS
    </div>

    <div id="library" class="page container-fluid g-0 text-center">
        <p>If you have not been redirected to the library please try again or click the button below</p>
        <a href="https://librarycat.org/lib/lemoose6" role="button" class="btn btn-primary btn-large">To Library</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
