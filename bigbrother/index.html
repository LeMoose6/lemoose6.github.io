<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Brother Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 2rem;
      padding: 1rem;
      background: #f4f4f4;
    }
    .column {
      flex: 1;
      background: #fff;
      border-radius: 6px;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
    }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 5px; }
    button { margin: 2px; }
    .vote-count { font-weight: bold; }
    .alliance { background: #eef; margin: 2px 0; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Houseguests -->
  <div class="column">
    <h2>Houseguests</h2>
    <input id="playerName" placeholder="Add player..." />
    <button onclick="addPlayer()">Add</button>
    <ul id="players"></ul>
  </div>

  <!-- Alliances -->
  <div class="column">
    <h2>Alliances</h2>
    <input id="allianceName" placeholder="New alliance..." />
    <button onclick="addAlliance()">Create Alliance</button>
    <div id="alliances"></div>
  </div>

  <!-- Votes -->
  <div class="column">
    <h2>Eviction Tracker</h2>
    <div>
      <select id="nominee1"></select>
      <select id="nominee2"></select>
      <button onclick="startEviction()">Start Eviction</button>
      <button onclick="completeEviction()">Complete Eviction</button>
    </div>
    <h3>Votes</h3>
    <ul id="voteList"></ul>
    <h3>Prediction</h3>
    <p id="prediction"></p>
  </div>

  <!-- Jury -->
  <div class="column">
    <h2>Jury</h2>
    <ul id="jury"></ul>
  </div>

  <!-- Control -->
  <div class="column">
    <h2>Week Control</h2>
    <button onclick="saveWeek()">Save Week as PDF</button>
    <div>
      <h3>HOH: <span id="hohDisplay">None</span></h3>
      <h3>Veto: <span id="vetoDisplay">None</span></h3>
      <select id="hohSelect"></select>
      <button onclick="setHOH()">Set HOH</button><br/>
      <select id="vetoSelect"></select>
      <button onclick="setVeto()">Set Veto</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    let players = [];
    let alliances = {};
    let hoh = null, veto = null;
    let jury = [];
    let evictionNominees = [];

    function renderPlayers() {
      const ul = document.getElementById('players');
      const hohSel = document.getElementById('hohSelect');
      const vetoSel = document.getElementById('vetoSelect');
      const n1 = document.getElementById('nominee1');
      const n2 = document.getElementById('nominee2');
      ul.innerHTML = '';
      hohSel.innerHTML = '';
      vetoSel.innerHTML = '';
      n1.innerHTML = '';
      n2.innerHTML = '';
      players.forEach(p => {
        if (!jury.includes(p)) {
          const li = document.createElement('li');
          li.textContent = p;
          ul.appendChild(li);
        }
        [hohSel, vetoSel, n1, n2].forEach(sel=>{
          const opt = document.createElement('option');
          opt.value = p; opt.textContent = p;
          sel.appendChild(opt);
        });
      });
    }

    function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      if (name && !players.includes(name)) {
        players.push(name);
        renderPlayers();
      }
      document.getElementById('playerName').value='';
    }

    function addAlliance() {
      const name = document.getElementById('allianceName').value.trim();
      if (name && !alliances[name]) {
        alliances[name] = [];
        renderAlliances();
      }
      document.getElementById('allianceName').value='';
    }

    function renderAlliances() {
      const div = document.getElementById('alliances');
      div.innerHTML = '';
      for (const [name, members] of Object.entries(alliances)) {
        const container = document.createElement('div');
        container.innerHTML = `<strong>${name}</strong>`;
        members.forEach(m=>{
          const span = document.createElement('span');
          span.className='alliance';
          span.textContent=m;
          container.appendChild(span);
        });
        const sel = document.createElement('select');
        players.forEach(p=>{
          const opt=document.createElement('option');
          opt.value=p; opt.textContent=p;
          sel.appendChild(opt);
        });
        const btn=document.createElement('button');
        btn.textContent='Add to Alliance';
        btn.onclick=()=>{ alliances[name].push(sel.value); renderAlliances(); };
        container.appendChild(sel);
        container.appendChild(btn);
        div.appendChild(container);
      }
    }

    function startEviction() {
      evictionNominees=[document.getElementById('nominee1').value, document.getElementById('nominee2').value];
      const ul=document.getElementById('voteList');
      ul.innerHTML='';
      players.forEach(p=>{
        if (!jury.includes(p) && !evictionNominees.includes(p)) {
          const li=document.createElement('li');
          li.textContent=`${p} votes: `;
          const sel=document.createElement('select');
          evictionNominees.forEach(n=>{
            const opt=document.createElement('option');
            opt.value=n; opt.textContent=n;
            sel.appendChild(opt);
          });
          sel.onchange=()=>predictVotes();
          li.appendChild(sel);
          ul.appendChild(li);
        }
      });
      predictVotes();
    }

    function completeEviction() {
      // Count votes
      const selections=[...document.querySelectorAll('#voteList select')].map(s=>s.value);
      const counts={};
      selections.forEach(v=>counts[v]=(counts[v]||0)+1);
      let evicted=Object.keys(counts).reduce((a,b)=>counts[a]>counts[b]?a:b);
      jury.push(evicted);
      evictionNominees=[];
      renderPlayers();
      renderJury();
      document.getElementById('voteList').innerHTML='';
      document.getElementById('prediction').textContent='';
    }

    function predictVotes() {
      let tally={};
      [...document.querySelectorAll('#voteList select')].forEach(sel=>{
        tally[sel.value]=(tally[sel.value]||0)+1;
      });
      let winner=Object.keys(tally).reduce((a,b)=> tally[a]>tally[b]?a:b, null);
      document.getElementById('prediction').textContent=
        winner ? `Predicted eviction: ${winner}` : '';
    }

    function renderJury() {
      const ul=document.getElementById('jury');
      ul.innerHTML='';
      jury.forEach(j=>{
        const li=document.createElement('li');
        li.textContent=j;
        ul.appendChild(li);
      });
    }

    function setHOH() {
      hoh=document.getElementById('hohSelect').value;
      document.getElementById('hohDisplay').textContent=hoh;
    }

    function setVeto() {
      veto=document.getElementById('vetoSelect').value;
      document.getElementById('vetoDisplay').textContent=veto;
    }

    async function saveWeek() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Big Brother - Weekly Recap", 10, 10);
      doc.text(`HOH: ${hoh||'None'}`,10,20);
      doc.text(`Veto: ${veto||'None'}`,10,30);
      doc.text("Players:",10,40);
      players.forEach((p,i)=>doc.text(`- ${p}${jury.includes(p)?' (Jury)':''}`,15,50+i*10));
      doc.text("Alliances:",100,40);
      let y=50;
      for (const [name,members] of Object.entries(alliances)) {
        doc.text(`${name}: ${members.join(', ')}`,100,y);
        y+=10;
      }
      doc.save("week_recap.pdf");
    }
  </script>
</body>
</html>
